[package]
name = "quill"
version = "0.1.0"
description = "Quill — AI-enhanced local-first Markdown editor"
authors = ["linyimin520812@gmail.com"]
edition = "2021"

[lib]
name = "quill_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "unstable", "protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
# SHA-256 for trusted-tier plugin integrity verification (TOFU gate). Already
# pulled in transitively by tauri-codegen; declaring it as a direct dep pins
# the version and makes the import path stable.
sha2 = "0.10"
# ed25519 signature verification for the trusted-tier plugin signature
# scaffolding (PR4). MVP does not REQUIRE signatures — `verify_plugin_signature`
# returns Ok(()) when no signature is present, so SHA-256 integrity remains the
# gate. This dep is pulled in now so a future marketplace can require ed25519
# signatures without a Cargo.toml change; see `docs/plugin-development.md`
# "Integrity upgrade path" for the migration story.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
# Base64 encoding for the optional `signature` / `publisherPublicKey` manifest
# fields (ed25519 signatures are bytes; we carry them as standard base64 in
# plugins.json + manifest.json so they survive JSON round-trips).
base64 = "0.22"
# HTTP client for the sandbox-tier `plugin_http_fetch` command. Sandbox plugins
# run in a host-webview iframe whose `fetch()` is gated by the main page's CSP
# `connect-src`; rather than relax CSP to admit every plugin-declared origin,
# the RPC bridge routes `http:fetch` to this Rust command which performs the
# request with `reqwest` (no CSP) and re-checks the manifest's origin allowlist
# as defense-in-depth behind the JS-side `isOriginAllowed` fast-fail. Already
# a transitive dep via tauri; declared directly for a stable import path.
# `rustls` is the TLS backend (no system OpenSSL on Linux — the release CI apt
# list does not install libssl-dev); in reqwest 0.13 it pulls `aws-lc-rs` as the
# crypto provider, which needs `cmake` (preinstalled on GitHub runners) to
# build. `charset` lets `Response::text()` honor non-UTF-8 bodies. `http2` and
# `system-proxy` are re-added because `default-features = false` drops them from
# the default set; the old JS `fetch()` spoke HTTP/2 and honored `HTTP_PROXY`,
# so dropping either would be a silent behavioral regression for plugins.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "system-proxy"] }
# chat mode (rig) LLM client. `default-features = false` + `reqwest`/`derive`/
# `rustls` re-selects rig-core's default set explicitly so a future default
# change can't silently pull `native-tls` (and system OpenSSL on Linux). All
# providers (OpenAI/Anthropic/...) compile unconditionally — features only gate
# transports/extras. `rustls` matches the reqwest TLS choice above; rig-core
# 0.40 also uses reqwest 0.13, so versions align. `futures` for `StreamExt::next`
# on the streaming response.
rig-core = { version = "0.40", default-features = false, features = ["reqwest", "derive", "rustls"] }
futures = "0.3"
# tokio direct dep for the fetch-RPC bridge (`oneshot` channel between the
# async URI scheme handler and the `plugin_rpc_respond` Tauri command; plus
# `time` for the 30s response timeout). Regular dep — not just dev — because
# the runtime path uses these APIs in the shipped binary.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# Diagnostics for unconditional code paths (voice module ready beacon, pet-api
# enabled beacon, global-shortcut handler trace, plugin-rpc emit-failed warn).
# Declared in main deps — NOT macOS-only — because the call sites compile on
# every platform; gating the crate under `[target.macos]` made Windows fail to
# resolve `log::info!` / `log::warn!` at link time.
log = "0.4"
# Local HTTP API for the desktop pet (pet-external-notify-api). tiny_http is
# sync + threaded — does NOT need tokio's `net` feature (unlike axum/hyper),
# so it adds the smallest dependency footprint for a single localhost
# endpoint. See .trellis/tasks/07-22-pet-external-notify-api/research/rust-http-server.md.
tiny_http = "0.12"
# PTY-backed terminal sessions for the right-dock terminal panel (wezterm's
# cross-platform pty layer: openpty on macOS/Linux, conpty on Windows).
portable-pty = "0.9"
# Chrome cookies/passwords import. rusqlite reads the Chromium SQLite stores;
# the aes/cbc/cipher/pbkdf2/hmac/sha1/sha2 stack implements Chrome's macOS
# "v10"/"v11" AES-128-CBC + PBKDF2("saltysalt", 1003) decryption exactly
# (same constants Chromium pins in components/os_crypt). `time` matches the
# `cookie` crate's expiry type used by tauri::webview::Cookie.
rusqlite = { version = "0.40", features = ["bundled"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
cipher = "0.5"
pbkdf2 = "0.13"
hmac = "0.13"
sha1 = "0.11"
time = "0.3"
# Zip extraction for the `install_plugin_zip` command (PR4). Sandbox-tier
# plugins are distributed as compiled-only zips; this crate does the unzip +
# the zip-slip / size-bomb / blacklist filtering in `plugin_commands.rs`.
zip = "2"
# Dev-only: RNG for the ed25519 signature round-trip tests (signs + verifies
# with a real keypair). NOT linked into the release binary — only used in
# `#[cfg(test)]` blocks.
[dev-dependencies]
rand = "0.8"
tempfile = "3"
# `#[tokio::test]` for the AppleSpeechAsr::transcribe() async tests ported
# from openless — the test drives `tauri::async_runtime::spawn_blocking` which
# needs a tokio runtime; `macros` provides the test attribute, `rt` the
# runtime. Regular deps do not pull tokio directly (it's transitive via
# tauri), so declare it here for the test build only.
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
# Voice input (PR2): cpal mic capture → 16kHz mono Int16 PCM; objc2/block2 for
# SFSpeechRecognizer FFI; anyhow for error context; parking_lot for the Mutex
# state holding the live Recorder handle; log for diagnostics. Versions match
# openless (`asr/local/apple_speech_provider.rs` + `recorder.rs`) verbatim —
# the port is a faithful minimal subset and must not drift on FFI-shaped deps.
cpal = "0.15"
block2 = "0.5"
objc2 = { version = "0.5", features = ["exception"] }
parking_lot = "0.12"
anyhow = "1"
# NSPanel backend for the pet / pet-panel windows. Converts the Tauri
# WebviewWindow into a real NSPanel (object_setClass onto a custom objc2
# subclass with empty ivars + mouse-event overrides — the design that avoids
# the click crash our earlier base-NSPanel swap hit, see task
# 07-06-pet-overlay-on-fullscreen-apps). Not on crates.io; the exact revision
# is pinned via Cargo.lock for reproducible builds.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

# Windows-only deps for Chrome cookie/password decryption (DPAPI + AES-GCM).
# Chrome on Windows stores the AES-256-GCM key in `Local State` under
# `os_crypt.encrypted_key`, base64-encoded with a 5-byte "DPAPI" prefix;
# CryptUnprotectData unwraps it. Each value is `v10` + 12-byte nonce +
# ciphertext + 16-byte GCM tag. macOS uses the same crate stack already
# declared above (aes/cbc/cipher) — Windows needs aes-gcm (GCM mode) and
# windows-sys for DPAPI.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
] }
aes-gcm = "0.10"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
