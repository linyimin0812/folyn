<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello Tool</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 24px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d14;
        color: #e6e6e6;
      }
      h1 { font-size: 18px; margin: 0 0 12px; }
      button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #2a2f3a;
        background: #1a1f2a;
        color: #e6e6e6;
        cursor: pointer;
        font: inherit;
      }
      button:hover { border-color: #3a6ef0; }
      #out { margin-top: 12px; padding: 8px; background: #11151c; border-radius: 6px; min-height: 20px; font-family: ui-monospace, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>👋 Hello Tool (sandbox plugin)</h1>
    <p>This plugin runs in a sandboxed iframe (<code>quill-plugin://</code> origin). It cannot touch the host DOM or Tauri APIs directly — every privileged call goes through <code>postMessage</code> to the host RPC bridge.</p>
    <button id="write">Write "Hello from Quill!" to clipboard</button>
    <button id="read">Read clipboard</button>
    <div id="out">(no output yet)</div>

    <!-- The iframe script. Loaded via quill-plugin://localhost/hello-tool/index.js -->
    <script src="index.js"></script>
  </body>
</html>
