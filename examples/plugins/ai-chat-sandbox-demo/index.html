<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Chat (Sandbox Sample)</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0d14; --brd: #1c2136; --inp: #0f1219;
        --t1: #e2e8f8; --t2: #9aa5c0; --t3: #6b7a96; --acc: #5b8af5;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SF Mono", "DM Mono", monospace;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f0f2f8; --brd: #dde2f0; --inp: #f4f5f8; --t1: #1a2040; --t2: #4a5580; --t3: #8892b0; --acc: #3a6ef0; }
      }
      body {
        margin: 0; padding: 20px; font: 14px/1.5 var(--font-ui);
        background: var(--bg); color: var(--t1);
        display: flex; flex-direction: column; gap: 12px; height: 100vh; box-sizing: border-box;
      }
      h1 { font-size: 16px; margin: 0; }
      .hint { color: var(--t3); font-size: 12px; }
      .hint code { font-family: var(--font-mono); }
      textarea, pre {
        margin: 0; background: var(--inp); color: var(--t1);
        border: 1px solid var(--brd); border-radius: 6px; padding: 8px;
        font: 12px/1.4 var(--font-mono); resize: none;
      }
      textarea { min-height: 60px; }
      pre { flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-word; }
      button {
        align-self: flex-start; padding: 4px 10px;
        border: 1px solid var(--brd); background: transparent; color: var(--acc);
        border-radius: 4px; cursor: pointer; font-size: 12px;
      }
      button:disabled { cursor: wait; opacity: 0.6; }
    </style>
  </head>
  <body>
    <h1>🤖 AI Chat (Sandbox Sample)</h1>
    <div class="hint">
      Sends <code>ai:chat</code> RPC to the host (postMessage). Host enforces
      <code>permissions.ai.chat</code> and streams <code>ai-stream</code>
      events back; final <code>response</code> ends the turn.
    </div>
    <textarea id="prompt" autocapitalize="off" spellcheck="false">Say hello in one sentence.</textarea>
    <button id="ask">Ask</button>
    <pre id="output">(empty)</pre>
    <script src="index.js"></script>
  </body>
</html>
