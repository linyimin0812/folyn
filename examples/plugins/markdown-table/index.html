<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Table Generator</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 20px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d14;
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100vh;
        box-sizing: border-box;
      }
      h1 { font-size: 16px; margin: 0; }
      .row { display: flex; gap: 8px; align-items: baseline; }
      .hint { color: #8a8f98; font-size: 12px; }
      textarea {
        flex: 1;
        min-height: 120px;
        background: #11151c;
        color: #e6e6e6;
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        padding: 8px;
        font: 12px/1.4 ui-monospace, monospace;
        resize: none;
      }
      pre {
        flex: 1;
        margin: 0;
        background: #11151c;
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        padding: 8px;
        font: 12px/1.4 ui-monospace, monospace;
        overflow: auto;
        white-space: pre-wrap;
      }
      .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      button {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #3a6ef0;
        background: #1a2233;
        color: #e6e6e6;
        cursor: pointer;
        font: inherit;
      }
      button:hover:not(:disabled) { background: #243455; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #status { color: #8a8f98; font-size: 12px; min-height: 16px; }
      .error { color: #ff6b6b; }
      .ok { color: #6bcf7e; }
    </style>
  </head>
  <body>
    <h1>▦ Markdown Table Generator</h1>
    <div class="row">
      <span class="hint">Paste CSV or TSV below. First row = header. Delimiter:</span>
      <select id="delim">
        <option value=",">Comma</option>
        <option value="\t">Tab</option>
        <option value="|">Pipe</option>
      </select>
    </div>
    <div class="pane">
      <textarea id="input" placeholder="Name,Age,City
Alice,30,Beijing
Bob,25,Shanghai"></textarea>
    </div>
    <div class="pane">
      <pre id="preview">(preview)</pre>
    </div>
    <div class="row">
      <button id="insert" disabled>Insert into active doc</button>
      <span id="status"></span>
    </div>

    <script src="index.js"></script>
  </body>
</html>
