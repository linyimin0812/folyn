<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>String Unescaper</title>
    <style>
      /* ponytail: sandbox iframe can't read host's [data-theme] on <html>, so we
       * mirror the host's theme tokens under prefers-color-scheme — same approach
       * as VoiceOrbApp.tsx for the voice-orb window. Fonts fall back to system
       * (CSP forbids @font-face / remote fonts in the plugin origin). */
      :root {
        color-scheme: light dark;
        --bg: #0b0d14; --panel: #0f1219; --surf: #13161f; --surf2: #181c28;
        --hov: #1b1f2e; --brd: #1c2136; --brd2: #252d4a;
        --t1: #e2e8f8; --t2: #9aa5c0; --t3: #6b7a96; --t4: #3a4560;
        --acc: #5b8af5; --card: #111420; --inp: #0f1219;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SF Mono", "DM Mono", monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f0f2f8; --panel: #fff; --surf: #f8f9fd; --surf2: #eef0f8;
          --hov: #e8ecf8; --brd: #dde2f0; --brd2: #c8d0e8;
          --t1: #1a2040; --t2: #4a5580; --t3: #8892b0; --t4: #c0c8e0;
          --acc: #3a6ef0; --card: #fff; --inp: #f4f5f8;
        }
      }
      body {
        margin: 0;
        padding: 20px;
        font: 14px/1.5 var(--font-ui);
        background: var(--bg);
        color: var(--t1);
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100vh;
        box-sizing: border-box;
      }
      h1 { font-size: 16px; margin: 0; color: var(--t1); }
      .hint { color: var(--t3); font-size: 12px; }
      .hint code { font-family: var(--font-mono); }
      .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      textarea, pre {
        flex: 1;
        margin: 0;
        background: var(--inp);
        color: var(--t1);
        border: 1px solid var(--brd);
        border-radius: 6px;
        padding: 8px;
        font: 12px/1.4 var(--font-mono);
        resize: none;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .preview {
        flex: 1;
        margin: 0;
        background: var(--panel);
        color: var(--t1);
        border: 1px solid var(--brd);
        border-radius: 6px;
        padding: 12px;
        overflow: auto;
      }
      .preview h1 { font-size: 18px; margin: 8px 0 4px; }
      .preview h2 { font-size: 16px; margin: 8px 0 4px; }
      .preview h3 { font-size: 15px; margin: 6px 0 4px; }
      .preview p { margin: 4px 0; }
      .preview ul, .preview ol { margin: 4px 0; padding-left: 24px; }
      .preview code { background: var(--surf2); color: var(--t1); padding: 1px 4px; border-radius: 3px; font: 12px var(--font-mono); }
      .preview pre { background: var(--surf); border: 1px solid var(--brd); padding: 8px; border-radius: 6px; overflow: auto; }
      .preview pre code { background: none; padding: 0; color: var(--t1); }
      .preview a { color: var(--acc); }
      .preview blockquote { border-left: 3px solid var(--brd2); margin: 4px 0; padding: 2px 12px; color: var(--t2); }
      .label { font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
  </head>
  <body>
    <h1>🔤 String Unescaper</h1>
    <div class="hint">Paste a string literal (with or without surrounding " or ' quotes). <code>\\n</code>, <code>\\t</code>, <code>\\uXXXX</code>, etc. are unescaped live.</div>

    <div class="pane">
      <div class="label">Input</div>
      <textarea id="input" placeholder="# Hello\n\nThis is **bold** and `code`." autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    </div>

    <div class="pane">
      <div class="label">Unescaped (raw)</div>
      <pre id="raw">(empty)</pre>
    </div>

    <div class="pane">
      <div class="label">Markdown preview</div>
      <div class="preview" id="preview"><p style="color:var(--t3)">(empty)</p></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
