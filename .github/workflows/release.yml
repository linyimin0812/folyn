name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty for draft build without upload."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ (inputs.tag || github.ref_name || '') != '' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.release_id.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install anthropic SDK
        run: pip install anthropic

      - name: Generate release notes
        shell: bash
        run: python3 .github/scripts/release_notes.py > release_notes.md
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - name: Create or update release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" --notes-file release_notes.md --title "$TAG" --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}

      - name: Get release ID
        id: release_id
        shell: bash
        run: echo "id=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.id')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}

  build:
    needs: release
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Resolve build tag
        id: bmeta
        shell: bash
        run: echo "tag=${{ inputs.tag || needs.release.outputs.tag || github.ref_name || '' }}" >> "$GITHUB_OUTPUT"

      - name: Sync version from tag
        if: ${{ steps.bmeta.outputs.tag != '' }}
        shell: bash
        run: |
          TAG="${{ steps.bmeta.outputs.tag }}"
          VER="${TAG#v}"
          python3 -c "import json,pathlib; p=pathlib.Path('apps/desktop/src-tauri/tauri.conf.json'); d=json.loads(p.read_text()); d['version']='$VER'; p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')"
          python3 -c "import pathlib,re; p=pathlib.Path('apps/desktop/src-tauri/Cargo.toml'); s=p.read_text(); s=re.sub(r'^version = \".*\"', f'version = \"$VER\"', s, flags=re.M); p.write_text(s)"

      - name: Build Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.release_id }}
          includeUpdaterJson: false
