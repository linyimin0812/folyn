name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty for draft build without upload."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Sync version from tag
        if: ${{ (inputs.tag || github.event.release.tag_name || '') != '' }}
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VER="${TAG#v}"
          python3 -c "import json,pathlib; p=pathlib.Path('apps/desktop/src-tauri/tauri.conf.json'); d=json.loads(p.read_text()); d['version']='$VER'; p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')"
          python3 -c "import pathlib,re; p=pathlib.Path('apps/desktop/src-tauri/Cargo.toml'); s=p.read_text(); s=re.sub(r'^version = \".*\"', f'version = \"$VER\"', s, flags=re.M); p.write_text(s)"

      - name: Build Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag || github.event.release.tag_name }}
          releaseName: ${{ inputs.tag || github.event.release.name }}
          releaseId: ${{ github.event.release.id || '' }}
          includeUpdaterJson: false
