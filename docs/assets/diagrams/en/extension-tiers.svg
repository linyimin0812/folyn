<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="760" viewBox="0 0 1560 760" role="img" aria-labelledby="title desc"><title id="title">技术流程图</title><desc id="desc">根据节点与连线配置排版的矢量流程图。</desc><rect width="1560" height="760" fill="white"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#92999e" stroke-width="1"/></marker></defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#1f2937} .edge{fill:none;stroke:#92999e;stroke-width:1;stroke-linejoin:round;marker-end:url(#arrow)} .pill{fill:#f5f9ff;stroke:#d2e1f1;stroke-width:1} .label{fill:#2563a6;font-size:12px}</style><path data-source="T1" data-target="T2" class="edge" d="M380,109 L380,151"/><path data-source="T2" data-target="T3" class="edge" d="M380,209 L380,271"/><path data-source="T3" data-target="T4" class="edge" d="M380,329 L380,401"/><path data-source="T4" data-target="T5" class="edge" d="M380,459 L380,531"/><path data-source="S1" data-target="S2" class="edge" d="M1180,109 L1180,151"/><path data-source="S2" data-target="S3" class="edge" d="M1180,209 L1180,271"/><path data-source="S3" data-target="S4" class="edge" d="M1180,329 L1180,401"/><path data-source="S4" data-target="S5" class="edge" d="M1180,459 L1180,531"/><path data-source="T5" data-target="HC" class="edge" d="M380,589 L380,630 L700,630 L700,671"/><path data-source="S5" data-target="HC" class="edge" d="M1180,589 L1180,630 L860,630 L860,671"/><path data-source="HC" data-target="S5" class="edge" d="M970,700 L1240,700 L1240,589"/><rect class="pill" x="420.0" y="618" width="240" height="24" rx="12"/><text class="label" x="540" y="634" text-anchor="middle">full direct access</text><rect class="pill" x="912.0" y="618" width="216" height="24" rx="12"/><text class="label" x="1020" y="634" text-anchor="middle">restricted proxy</text><rect class="pill" x="1138.0" y="638" width="204" height="24" rx="12"/><text class="label" x="1240" y="654" text-anchor="middle">response · push</text><g id="T1"><rect x="250.0" y="51" width="260" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="380" y="77" text-anchor="middle">trusted extension</text><text x="380" y="92" text-anchor="middle">built-in · TOFU user pin</text></g><g id="T2"><rect x="250.0" y="151" width="260" height="58" rx="14" fill="#edf4f3" stroke="#648c84" stroke-width="1" stroke-dasharray="2 2"/><text x="380" y="177" text-anchor="middle">TOFU trust gate</text><text x="380" y="192" text-anchor="middle">user pin + integrity</text></g><g id="T3"><rect x="240.0" y="271" width="280" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="380" y="297" text-anchor="middle">blob URL + import()</text><text x="380" y="312" text-anchor="middle">inject host main realm</text></g><g id="T4"><rect x="230.0" y="401" width="300" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="380" y="427" text-anchor="middle">runs in host main realm</text><text x="380" y="442" text-anchor="middle">full power · DOM · Tauri API</text></g><g id="T5"><rect x="240.0" y="531" width="280" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="380" y="557" text-anchor="middle">in-process contributions</text><text x="380" y="572" text-anchor="middle">commands · features · tools</text></g><g id="S1"><rect x="1060.0" y="51" width="240" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="1180" y="77" text-anchor="middle">sandbox extension</text><text x="1180" y="92" text-anchor="middle">third-party · marketplace</text></g><g id="S2"><rect x="1050.0" y="151" width="260" height="58" rx="14" fill="#edf4f3" stroke="#648c84" stroke-width="1" stroke-dasharray="2 2"/><text x="1180" y="177" text-anchor="middle">install check (Rust)</text><text x="1180" y="192" text-anchor="middle">manifest · origin allowlist</text></g><g id="S3"><rect x="10