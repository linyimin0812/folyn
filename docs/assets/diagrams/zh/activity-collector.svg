<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1040" viewBox="0 0 1560 1040" role="img" aria-labelledby="title desc"><title id="title">技术流程图</title><desc id="desc">根据节点与连线配置排版的矢量流程图。</desc><rect width="1560" height="1040" fill="white"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#92999e" stroke-width="1"/></marker></defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#1f2937} .edge{fill:none;stroke:#92999e;stroke-width:1;stroke-linejoin:round;marker-end:url(#arrow)} .pill{fill:#f5f9ff;stroke:#d2e1f1;stroke-width:1} .label{fill:#2563a6;font-size:12px}</style><path data-source="EXT" data-target="RG" class="edge" d="M1270,109 L1270,171"/><path data-source="SCH" data-target="CUR" class="edge" d="M430,109 L430,171"/><path data-source="CUR" data-target="CTX" class="edge" d="M430,229 L430,291"/><path data-source="CTX" data-target="COL" class="edge" d="M430,349 L430,411"/><path data-source="RG" data-target="COL" class="edge" d="M1270,229 L1270,440 L600,440"/><path data-source="COL" data-target="PRIV" class="edge" d="M430,469 L430,531"/><path data-source="PRIV" data-target="ING" class="edge" d="M430,589 L430,651"/><path data-source="WH" data-target="ING" class="edge" d="M1100,560 L1100,660 L600,660"/><path data-source="ING" data-target="SET" class="edge" d="M430,709 L430,771"/><path data-source="SET" data-target="K" class="edge" d="M430,829 L430,891"/><path data-source="SET" data-target="SCH" class="edge" d="M260,800 L80,800 L80,80 L260,80"/><path data-source="K" data-target="TL" class="edge" d="M600,920 L810,920"/><path data-source="K" data-target="AI" class="edge" d="M430,949 L430,985 L1300,985 L1300,949"/><rect class="pill" x="833.0" y="428" width="204" height="24" rx="12"/><text class="label" x="935" y="444" text-anchor="middle">调度 impl.collect</text><rect class="pill" x="766.0" y="648" width="168" height="24" rx="12"/><text class="label" x="850" y="664" text-anchor="middle">onWebhook 事件</text><rect class="pill" x="20.0" y="428" width="120" height="24" rx="12"/><text class="label" x="80" y="444" text-anchor="middle">游标仅成功后推进</text><rect class="pill" x="633.0" y="908" width="144" height="24" rx="12"/><text class="label" x="705" y="924" text-anchor="middle">query·runs</text><g id="SCH"><rect x="260.0" y="51" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="77" text-anchor="middle">调度器/手动触发</text><text x="430" y="92" text-anchor="middle">60s 下限·防重入</text></g><g id="CUR"><rect x="260.0" y="171" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="197" text-anchor="middle">读游标</text><text x="430" y="212" text-anchor="middle">activity_get_cursor</text></g><g id="CTX"><rect x="260.0" y="291" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="317" text-anchor="middle">ctx 能力注入</text><text x="430" y="332" text-anchor="middle">exec·http·frontWindow 等固定命令</text></g><g id="COL"><rect x="260.0" y="411" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="437" text-anchor="middle">impl.collect(ctx)</text><text x="430" y="452" text-anchor="middle">返回 events + nextCursor</text></g><g id="PRIV"><rect x="260.0" y="531" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="557" text-anchor="middle">applyPrivacy 脱敏</text><text x="430" y="572" text-anchor="middle">redact 正则·默认丢 raw</text></g><g id="ING"><rect x="260.0" y="651" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="677" text-anchor="middle">activity_push_events</text><text x="430" y="692" text-anchor="middle">Rust ingest·去重·入库</text></g><g id="SET"><rect x="260.0" y="771" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width