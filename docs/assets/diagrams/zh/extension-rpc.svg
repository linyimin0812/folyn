<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="940" viewBox="0 0 1700 940" role="img" aria-labelledby="title desc"><title id="title">技术流程图</title><desc id="desc">根据节点与连线配置排版的矢量流程图。</desc><rect width="1700" height="940" fill="white"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#92999e" stroke-width="1"/></marker></defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#1f2937} .edge{fill:none;stroke:#92999e;stroke-width:1;stroke-linejoin:round;marker-end:url(#arrow)} .pill{fill:#f5f9ff;stroke:#d2e1f1;stroke-width:1} .label{fill:#2563a6;font-size:12px}</style><path data-source="IFRM" data-target="R1" class="edge" d="M1270,99 L1270,171"/><path data-source="HOST" data-target="L2" class="edge" d="M430,99 L430,291"/><path data-source="R1" data-target="L2" class="edge" d="M1100,200 L850,200 L850,320 L600,320"/><path data-source="L2" data-target="L3" class="edge" d="M430,349 L430,411"/><path data-source="L3" data-target="L4" class="edge" d="M430,469 L430,531"/><path data-source="L4" data-target="R2" class="edge" d="M600,560 L1100,560"/><path data-source="R2" data-target="R1" class="edge" d="M1440,560 L1480,560 L1480,200 L1440,200"/><path data-source="L4" data-target="L5" class="edge" d="M430,589 L430,651"/><path data-source="L5" data-target="R3" class="edge" d="M600,680 L1100,680"/><path data-source="R2" data-target="R3" class="edge" d="M1270,589 L1270,651"/><path data-source="L5" data-target="L6" class="edge" d="M430,709 L430,771"/><path data-source="L6" data-target="R4" class="edge" d="M600,800 L1100,800"/><path data-source="R3" data-target="R4" class="edge" d="M1270,709 L1270,771"/><path data-source="R4" data-target="L6" class="edge" d="M1270,829 L1270,870 L430,870 L430,829"/><rect class="pill" x="670.0" y="248" width="360" height="24" rx="12"/><text class="label" x="850" y="264" text-anchor="middle">request {id, method, params}</text><rect class="pill" x="676.0" y="548" width="348" height="24" rx="12"/><text class="label" x="850" y="564" text-anchor="middle">response {id, result/error}</text><rect class="pill" x="1438.0" y="368" width="84" height="24" rx="12"/><text class="label" x="1480" y="384" text-anchor="middle">返回调用方</text><rect class="pill" x="640.0" y="668" width="420" height="24" rx="12"/><text class="label" x="850" y="684" text-anchor="middle">lifecycle · env-event · ai-stream</text><rect class="pill" x="718.0" y="788" width="264" height="24" rx="12"/><text class="label" x="850" y="804" text-anchor="middle">invoke {id, command}</text><rect class="pill" x="682.0" y="858" width="336" height="24" rx="12"/><text class="label" x="850" y="874" text-anchor="middle">invoke-result {id, result}</text><g id="HOST"><rect x="260.0" y="41" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="67" text-anchor="middle">宿主 RpcBridge</text><text x="430" y="82" text-anchor="middle">主窗口 realm·message 监听</text></g><g id="IFRM"><rect x="1100.0" y="41" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="1270" y="67" text-anchor="middle">扩展 sandbox iframe</text><text x="1270" y="82" text-anchor="middle">不透明 origin·隔离 realm</text></g><g id="R1"><rect x="1100.0" y="171" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="1270" y="197" text-anchor="middle">扩展调用宿主能力</text><text x="1270" y="212" text-anchor="middle">api.fs.read(path)</text></g><g id="L2"><rect x="260.0" y="291" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="317" text-anchor="middle">接收 request·验来源</text><text x="430" y="332" text-anchor="middle">source === iframe 窗口</text></g><g id="L3"><rect x="260.0" y="411" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="437" text-anchor="middle">dispatchExtensionRpc</text><text x="430" y="452" text-anchor="middle">按 manifest permissions 门控</text></g><g id="L4"><rect x="260.0" y="531" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="557" text-anchor="middle">执行能力·sendResponse</text><text x="430" y="572" text-anchor="middle">fs glob·http origins·ai</text></g><g id="R2"><rect x="1100.0" y="531" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="1270" y="557" text-anchor="middle">按 id 匹配 Promise</text><text x="1270" y="572" text-anchor="middle">resolve 返回调用方</text></g><g id="L5"><rect x="260.0" y="651" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="677" text-anchor="middle">宿主推送消息</text><text x="430" y="692" text-anchor="middle">lifecycle·env-event·ai-stream</text></g><g id="R3"><rect x="1100.0" y="651" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="1270" y="677" text-anchor="middle">扩展监听 message</text><text x="1270" y="692" text-anchor="middle">onEvent 更新 UI·流式渲染</text></g><g id="L6"><rect x="260.0" y="771" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="430" y="797" text-anchor="middle">宿主调用扩展命令</text><text x="430" y="812" text-anchor="middle">⌘P 命令·30s 超时</text></g><g id="R4"><rect x="1100.0" y="771" width="340" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="1270" y="797" text-anchor="middle">iframe 执行 command</text><text x="1270" y="812" text-anchor="middle">返回 invoke-result</text></g></svg>